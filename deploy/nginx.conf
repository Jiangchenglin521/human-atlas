# 人体图谱静态站点
# 访问路径：https://域名/maas/human-atlas/
# 上传方式：把 dist/ 目录里的全部文件放到 /data/www/human-atlas/
#          （index.html 的最终路径是 /data/www/human-atlas/index.html）

# alias 与 try_files 不能直接搭配：try_files 会按 root 拼路径，
# 真实文件会 404。这里用 alias 解析后的 $request_filename 判断。
location /maas/human-atlas/ {
    alias /data/www/human-atlas/;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    expires 30d;
    add_header Cache-Control "public";

    if (!-e $request_filename) {
        rewrite ^ /maas/human-atlas/index.html last;
    }
}

# 入口页不长期缓存，避免发版后浏览器仍拿旧的 index.html。
# .bin.gz 不在 gzip_types 里，Nginx 不会把已压缩的模型再压一次。
location = /maas/human-atlas/index.html {
    alias /data/www/human-atlas/index.html;
    gzip on;
    gzip_types text/html;
    expires -1;
    add_header Cache-Control "no-cache";
}
